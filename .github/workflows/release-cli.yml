name: Release standalone swig-cli binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            label: Linux x86-64
            artifact: swig-cli-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            label: Linux ARM64
            artifact: swig-cli-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            label: macOS Intel
            artifact: swig-cli-macos-x64
          - os: macos-14
            target: bun-darwin-arm64
            label: macOS Apple silicon
            artifact: swig-cli-macos-arm64
          - os: windows-latest
            target: bun-windows-x64-baseline
            label: Windows x86-64
            artifact: swig-cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run check
      - name: Compile one self-contained executable
        run: |
          node -e "require('node:fs').mkdirSync('release', { recursive: true })"
          bun build cli-src/swig-cli-standalone.mjs cli-src/swig-worker.mjs --compile --target=${{ matrix.target }} --outfile=release/${{ matrix.artifact }}
      - name: Smoke-test the actual executable
        env:
          SWIG_CLI_EXECUTABLE: ${{ github.workspace }}/release/${{ matrix.artifact }}
        run: node --test tests/cli-smoke.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
