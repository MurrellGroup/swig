name: Release standalone swig-cli binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wasm:
    name: Build SwiftIg WASM core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned WASI SDK
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
      - name: Build SIMD/LTO WebAssembly core
        run: npm run build:wasm
        env:
          WASI_SDK: ${{ runner.temp }}/wasi-sdk-25.0-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: swig-wasm-core
          path: public/swiftig.wasm
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            label: Linux x86-64 baseline
            artifact: swig-cli-linux-x64
          - os: ubuntu-latest
            target: bun-linux-x64-modern
            label: Linux x86-64 modern (Haswell/AVX2)
            artifact: swig-cli-linux-x64-modern
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            label: Linux ARM64
            artifact: swig-cli-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            label: macOS Intel
            artifact: swig-cli-macos-x64
          - os: macos-14
            target: bun-darwin-arm64
            label: macOS Apple silicon
            artifact: swig-cli-macos-arm64
          - os: ubuntu-latest
            target: bun-windows-x64-baseline
            label: Windows x86-64
            artifact: swig-cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - name: Use source-built SwiftIg WASM core
        uses: actions/download-artifact@v4
        with:
          name: swig-wasm-core
          path: public
      - run: npm run check
      - name: Compile one self-contained executable
        run: |
          node -e "require('node:fs').mkdirSync('release', { recursive: true })"
          bun build cli-src/swig-cli-standalone.mjs cli-src/swig-worker.mjs cli-src/post-analysis-worker.mjs cli-src/chmmairra-worker.mjs --compile --minify --target=${{ matrix.target }} --outfile=release/${{ matrix.artifact }}
      - name: Smoke-test the actual executable
        if: matrix.target != 'bun-windows-x64-baseline'
        env:
          SWIG_CLI_EXECUTABLE: ${{ github.workspace }}/release/${{ matrix.artifact }}
        run: node --test tests/cli-smoke.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swig-cli-*
          path: release
          merge-multiple: true
      - name: Publish release binaries
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
