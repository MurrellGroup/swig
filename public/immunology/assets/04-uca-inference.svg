<text x="422" y="753" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="end" fill="#6A5393">0.4</text>
<path d="M458 700 H545" fill="none" stroke="#546777" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="78" y="813" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#546777">Only these two codons occur</text>
