<text x="408.0" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#647483">N</text>
<rect x="429" y="206" width="93" height="49" rx="0" fill="#ECE6F5" stroke="#6A5393" stroke-width="1.2"/>
<text x="475.5" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#6A5393">J</text>
<text x="67" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1C3040">Segment choice, trimming, and added bases</text>
<text x="67" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1C3040">give a structured prior.</text>
<text x="666" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#1C3040">Observed descendants</text>
