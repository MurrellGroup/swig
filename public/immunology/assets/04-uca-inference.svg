<rect x="302" y="419" width="596" height="89" rx="8" fill="#DEEFF2" stroke="#216879" stroke-width="1.2"/>
<text x="600" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#216879">Posterior ancestral alternatives</text>
<text x="600" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1C3040">Uncertainty can concern both sequence and segment origin.</text>
<text x="44" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1C3040">A simple example: neighbouring bases can share uncertainty</text>
