<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="title desc">
<title id="title">UCA inference combines recombination and phylogenetic evidence</title><desc id="desc">A recombination prior describes plausible inherited-segment choices, trimming, and added bases. A tree likelihood accounts for shared mutations among observed descendants. Together they give posterior alternatives for an ancestral sequence and its origin. A synthetic example has only two possible ancestral codons: AAA with probability 0.6 and GGC with probability 0.4. The marginal probabilities at positions one and two are A 0.6 and G 0.4, and at position three A 0.6 and C 0.4. The joint amino-acid distribution is lysine 0.6 and glycine 0.4. Multiplying the three base marginals would create codons absent from this example.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#546777"/></marker><pattern id="added" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#E8EDF1"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#C9D3DC" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1200" height="935" rx="0" fill="#FFFFFF"/>
<text x="44" y="51" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1C3040">Reconstructing a pre-SHM sequence</text>
<text x="44" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#546777">Recombination and related descendants provide complementary information.</text>
