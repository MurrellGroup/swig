<text x="909" y="310" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="22" font-weight="400" text-anchor="start" fill="#1C3040">ATGTAT</text>
<text x="666" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#546777">The tree accounts for shared mutations.</text>
