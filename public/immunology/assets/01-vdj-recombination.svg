<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">V(D)J recombination assembles a heavy-chain variable region</title><desc id="desc">A schematic inherited heavy-chain locus contains several V, D, and J segments followed by constant-region exons. V2, D2, and J1 are selected. Trimming and added nucleotides create a joined variable-region exon. An invented 15-base junction is TGT AC GGTAC TA TGG, with source boundaries that cut across codons. It translates to cysteine, threonine, valine, leucine, tryptophan. IMGT CDR3 is the three internal amino acids; the reported junction also includes the conserved flanking cysteine and tryptophan.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#546777"/></marker><pattern id="added" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#E8EDF1"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#C9D3DC" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1200" height="890" rx="0" fill="#FFFFFF"/>
